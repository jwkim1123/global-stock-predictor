name: 데이터 업데이트·배포

# 무료 티어를 고려한 경량 설계
#  - 평일 하루 2회 (아시아 장 마감 후 · 미국 장 마감 후) + 수동 실행 + 코드 변경 시
#  - 수집은 보통 1분 내외, 분석 1분 내외. 캐시(TTL)를 재사용해 같은 날 재실행 시 요청을 거의 하지 않음
#  - 저장소에는 예측 기록(history/predictions.csv)만 커밋하고, 대용량 데이터는 Pages 아티팩트로만 배포
on:
  schedule:
    - cron: '17 10 * * 1-5' # UTC 10:17 = 한국시간 19:17 (한국·일본·중국·대만·인도 등 아시아 장 마감 후)
    - cron: '17 22 * * 1-5' # UTC 22:17 = 한국시간 다음날 07:17 (미국 장 마감 후)
  workflow_dispatch:
    inputs:
      force:
        description: '캐시를 무시하고 전체 재수집'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['history/**', '**.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: 수집 캐시 복원
        uses: actions/cache@v6
        with:
          path: .cache
          key: collect-${{ github.run_id }}
          restore-keys: collect-

      - name: 데이터 수집 (Yahoo Finance · FRED · 네이버 증권)
        run: node scripts/collect.mjs ${{ inputs.force && '--force' || '' }}

      - name: 분석 실행 · 사이트 생성
        run: node scripts/build.mjs --site

      - name: 예측 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/predictions.csv
          if ! git diff --cached --quiet; then
            git commit -m "예측 기록 업데이트 $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
