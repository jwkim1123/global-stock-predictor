name: 수집 테스트 (임시)
on:
  workflow_dispatch:
    inputs:
      only:
        description: '특정 심볼만 (쉼표 구분, 비우면 전체)'
        required: false
        default: ''
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/collect.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: raw-data
          path: data/raw
          retention-days: 3
